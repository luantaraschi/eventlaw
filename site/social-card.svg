    <linearGradient id="law" x1="450" y1="220" x2="760" y2="340" gradientUnits="userSpaceOnUse"><stop stop-color="#a39aff"/><stop offset=".55" stop-color="#7969ff"/><stop offset="1" stop-color="#43d7c5"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(963 86) rotate(127) scale(530 710)" gradientUnits="userSpaceOnUse"><stop stop-color="#143b34"/><stop offset="1" stop-color="#071412"/></radialGradient>
