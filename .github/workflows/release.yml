name: Publish npm release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    if: github.repository == 'luantaraschi/eventlaw'
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an npm CLI with trusted publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: >-
          node --eval "const version = require('./package.json').version;
          if (process.env.GITHUB_REF_NAME !== 'v' + version) {
          throw new Error('Expected tag v' + version + ', received ' + process.env.GITHUB_REF_NAME) }"

      - name: Run release checks
        run: npm run release:check

      - name: Check whether this version already exists
        id: registry
        run: |
          VERSION=$(node --print "require('./package.json').version")
          if npm view "eventlaw@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with provenance
        if: steps.registry.outputs.published == 'false'
        run: |
          VERSION=$(node --print "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            npm publish --tag beta
          else
            npm publish
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
